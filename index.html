<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NSS NIT Silchar — UG 2026–2030</title>
  <style>
    :root {
      --bg: #001030;
      --button-bg: rgba(255, 255, 255, 0.16);
      --button-hover: rgba(255, 255, 255, 0.28);
      --dot: rgba(255, 255, 255, 0.45);
      --dot-active: #fff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      background: var(--bg);
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
    }

    .carousel {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      perspective: 2000px;
    }

    .viewport {
      width: 100%;
      height: 100%;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Group Stage Container for 3-Panel Unfolds */
    .group-stage {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity 400ms ease, visibility 0s linear 400ms;
    }

    .group-stage.active {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
      transition: opacity 400ms ease, visibility 0s;
    }

    /* Seamless Connected Panel Strip */
    .panel-strip {
      display: flex;
      align-items: center;
      justify-content: center;
      transform-style: preserve-3d;
    }

    /* Individual Panels with Zero Gaps */
    .panel {
      position: relative;
      max-width: 0;
      opacity: 0;
      overflow: hidden;
      transform-origin: left center;
      transform: rotateY(-70deg) scale(0.85);
      transition: 
        max-width 600ms cubic-bezier(0.25, 1, 0.5, 1),
        opacity 500ms ease,
        transform 600ms cubic-bezier(0.25, 1, 0.5, 1);
    }

    /* Revealed state: Expands panel into the row */
    .panel.revealed {
      max-width: 32vw;
      opacity: 1;
      transform: rotateY(0deg) scale(1);
    }

    .panel img {
      display: block;
      height: 85vh;
      width: auto;
      max-width: 32vw;
      object-fit: contain;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.45);
    }

    /* Standalone Slide 7 */
    .slide-standalone {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      visibility: hidden;
      transform: scale(0.9) rotateY(20deg);
      transition: transform 600ms cubic-bezier(0.25, 1, 0.5, 1), opacity 400ms ease, visibility 0s linear 400ms;
      pointer-events: none;
    }

    .slide-standalone.active {
      opacity: 1;
      visibility: visible;
      transform: scale(1) rotateY(0deg);
      transition: transform 600ms cubic-bezier(0.25, 1, 0.5, 1), opacity 400ms ease, visibility 0s;
      pointer-events: auto;
    }

    .slide-standalone img {
      display: block;
      max-width: 100vw;
      max-height: 90vh;
      width: auto;
      height: auto;
      object-fit: contain;
      box-shadow: 0 16px 50px rgba(0, 0, 0, .35);
    }

    /* Navigation Controls */
    .nav {
      position: fixed;
      top: 50%;
      transform: translateY(-50%);
      width: 52px;
      height: 52px;
      border: 1px solid rgba(255,255,255,.25);
      border-radius: 50%;
      background: var(--button-bg);
      color: #fff;
      font-size: 34px;
      line-height: 1;
      cursor: pointer;
      z-index: 10;
      display: grid;
      place-items: center;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      transition: background .2s, transform .2s;
    }

    .nav:hover {
      background: var(--button-hover);
    }

    .nav:active {
      transform: translateY(-50%) scale(.94);
    }

    .nav.left { left: 22px; }
    .nav.right { right: 22px; }

    .dots {
      position: fixed;
      left: 50%;
      bottom: 22px;
      transform: translateX(-50%);
      z-index: 10;
      display: flex;
      gap: 9px;
      padding: 9px 13px;
      border-radius: 999px;
      background: rgba(0,0,0,.35);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    .dot {
      width: 9px;
      height: 9px;
      border: 0;
      border-radius: 50%;
      padding: 0;
      background: var(--dot);
      cursor: pointer;
      transition: transform .2s, background .2s;
    }

    .dot.active {
      background: var(--dot-active);
      transform: scale(1.45);
    }

    .counter {
      position: fixed;
      top: 18px;
      right: 22px;
      z-index: 10;
      font-size: 13px;
      letter-spacing: .08em;
      padding: 7px 10px;
      border-radius: 999px;
      background: rgba(0,0,0,.35);
      color: rgba(255,255,255,.9);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    @media (max-width: 700px) {
      .panel.revealed {
        max-width: 33vw;
      }

      .panel img {
        height: 75vh;
        max-width: 33vw;
      }

      .nav {
        width: 44px;
        height: 44px;
        font-size: 28px;
        background: rgba(0,0,0,.35);
      }

      .nav.left { left: 10px; }
      .nav.right { right: 10px; }

      .dots {
        bottom: max(14px, env(safe-area-inset-bottom));
      }

      .counter {
        top: 12px;
        right: 12px;
        font-size: 11px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .group-stage,
      .panel,
      .slide-standalone {
        transition: opacity 150ms ease !important;
        transform: none !important;
      }
    }
  </style>
</head>
<body>
  <main class="carousel" aria-label="NSS NIT Silchar information slideshow">
    <div class="viewport" id="viewport">
      
      <!-- Group Stage 1: Panels 1 to 3 (Reveals 1, then 1+2, then 1+2+3 together) -->
      <div class="group-stage active" id="group-1">
        <div class="panel-strip">
          <figure class="panel revealed" id="p1">
            <img src="https://res.cloudinary.com/dlnwn8bfb/image/upload/v1787653201/panel1_uakzha.jpg" alt="NSS NIT Silchar welcome poster for UG 2026–2030 batch">
          </figure>
          <figure class="panel" id="p2">
            <img src="https://res.cloudinary.com/dlnwn8bfb/image/upload/v1787653232/panel4_lmy6vm.jpg" alt="NSS NIT Silchar about us, motto and major activities">
          </figure>
          <figure class="panel" id="p3">
            <img src="https://res.cloudinary.com/dlnwn8bfb/image/upload/v1787653232/panel6_iede51.jpg" alt="NSS benefits and common questions and answers">
          </figure>
        </div>
      </div>

      <!-- Group Stage 2: Panels 4 to 6 (Reveals 4, then 4+5, then 4+5+6 together) -->
      <div class="group-stage" id="group-2">
        <div class="panel-strip">
          <figure class="panel" id="p4">
            <img src="https://res.cloudinary.com/dlnwn8bfb/image/upload/v1787653231/panel5_euwjxf.jpg" alt="NSS NIT Silchar event gallery">
          </figure>
          <figure class="panel" id="p5">
            <img src="https://res.cloudinary.com/dlnwn8bfb/image/upload/v1787653230/panel3_puvzen.jpg" alt="NSS orientation and recruitment process">
          </figure>
          <figure class="panel" id="p6">
            <img src="https://res.cloudinary.com/dlnwn8bfb/image/upload/v1787653232/panel2_cvw1fs.jpg" alt="NSS NIT Silchar contact details and social media">
          </figure>
        </div>
      </div>

      <!-- Slide 7: Standalone Brochure -->
      <figure class="slide-standalone" id="slide-7">
        <img src="https://res.cloudinary.com/dlnwn8bfb/image/upload/v1787664130/image_aktfyd.jpg" alt="NSS Brochure for UG 2026–2030 batch">
      </figure>

    </div>

    <button class="nav left" id="prev" aria-label="Previous slide" title="Previous slide">&#10094;</button>
    <button class="nav right" id="next" aria-label="Next slide" title="Next slide">&#10095;</button>

    <div class="counter" id="counter" aria-live="polite">1 / 7</div>

    <nav class="dots" aria-label="Slide navigation">
      <button class="dot active" aria-label="Go to slide 1"></button>
      <button class="dot" aria-label="Go to slide 2"></button>
      <button class="dot" aria-label="Go to slide 3"></button>
      <button class="dot" aria-label="Go to slide 4"></button>
      <button class="dot" aria-label="Go to slide 5"></button>
      <button class="dot" aria-label="Go to slide 6"></button>
      <button class="dot" aria-label="Go to slide 7"></button>
    </nav>
  </main>

  <script>
    (() => {
      const TOTAL_SLIDES = 7;
      let current = 0;
      let isAnimating = false;
      let touchStartX = 0;
      let touchStartY = 0;

      const group1 = document.getElementById("group-1");
      const group2 = document.getElementById("group-2");
      const slide7 = document.getElementById("slide-7");

      const p1 = document.getElementById("p1");
      const p2 = document.getElementById("p2");
      const p3 = document.getElementById("p3");
      const p4 = document.getElementById("p4");
      const p5 = document.getElementById("p5");
      const p6 = document.getElementById("p6");

      const dots = [...document.querySelectorAll(".dot")];
      const prevButton = document.getElementById("prev");
      const nextButton = document.getElementById("next");
      const viewport = document.getElementById("viewport");
      const counter = document.getElementById("counter");

      function update(nextIndex) {
        if (isAnimating || nextIndex === current) return;
        isAnimating = true;

        // Loop after slide 7 back to slide 1 (Index 0)
        current = (nextIndex + TOTAL_SLIDES) % TOTAL_SLIDES;

        // Deactivate all stages initially
        group1.classList.remove("active");
        group2.classList.remove("active");
        slide7.classList.remove("active");

        // Slide 1 (Index 0): Show Group 1 (Panel 1 only)
        if (current === 0) {
          group1.classList.add("active");
          p1.classList.add("revealed");
          p2.classList.remove("revealed");
          p3.classList.remove("revealed");
        } 
        // Slide 2 (Index 1): Show Group 1 (Panels 1 + 2 side-by-side)
        else if (current === 1) {
          group1.classList.add("active");
          p1.classList.add("revealed");
          p2.classList.add("revealed");
          p3.classList.remove("revealed");
        } 
        // Slide 3 (Index 2): Show Group 1 (Panels 1 + 2 + 3 together)
        else if (current === 2) {
          group1.classList.add("active");
          p1.classList.add("revealed");
          p2.classList.add("revealed");
          p3.classList.add("revealed");
        } 
        // Slide 4 (Index 3): Show Group 2 (Panel 4 only)
        else if (current === 3) {
          group2.classList.add("active");
          p4.classList.add("revealed");
          p5.classList.remove("revealed");
          p6.classList.remove("revealed");
        } 
        // Slide 5 (Index 4): Show Group 2 (Panels 4 + 5 side-by-side)
        else if (current === 4) {
          group2.classList.add("active");
          p4.classList.add("revealed");
          p5.classList.add("revealed");
          p6.classList.remove("revealed");
        } 
        // Slide 6 (Index 5): Show Group 2 (Panels 4 + 5 + 6 together)
        else if (current === 5) {
          group2.classList.add("active");
          p4.classList.add("revealed");
          p5.classList.add("revealed");
          p6.classList.add("revealed");
        } 
        // Slide 7 (Index 6): Show Standalone Brochure
        else if (current === 6) {
          slide7.classList.add("active");
        }

        // Update active dots and top counter
        dots.forEach((dot, index) => {
          dot.classList.toggle("active", index === current);
          dot.setAttribute("aria-current", index === current ? "true" : "false");
        });

        counter.textContent = `${current + 1} / ${TOTAL_SLIDES}`;

        setTimeout(() => {
          isAnimating = false;
        }, 600);
      }

      function goNext() {
        update(current + 1);
      }

      function goPrev() {
        update(current - 1);
      }

      nextButton.addEventListener("click", goNext);
      prevButton.addEventListener("click", goPrev);

      dots.forEach((dot, index) => {
        dot.addEventListener("click", () => update(index));
      });

      document.addEventListener("keydown", (event) => {
        if (event.key === "ArrowRight") {
          event.preventDefault();
          goNext();
        } else if (event.key === "ArrowLeft") {
          event.preventDefault();
          goPrev();
        } else if (event.key === "Home") {
          event.preventDefault();
          update(0);
        } else if (event.key === "End") {
          event.preventDefault();
          update(TOTAL_SLIDES - 1);
        }
      });

      viewport.addEventListener("touchstart", (event) => {
        const touch = event.changedTouches[0];
        touchStartX = touch.clientX;
        touchStartY = touch.clientY;
      }, { passive: true });

      viewport.addEventListener("touchend", (event) => {
        const touch = event.changedTouches[0];
        const dx = touch.clientX - touchStartX;
        const dy = touch.clientY - touchStartY;

        if (Math.abs(dx) < 45 || Math.abs(dx) < Math.abs(dy)) return;

        if (dx < 0) goNext();
        else goPrev();
      }, { passive: true });
    })();
  </script>
</body>
</html>
