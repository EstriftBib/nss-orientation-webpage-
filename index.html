<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>NSS NIT Silchar — Mobile Brochure</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <style>
    :root { --navy:#082477; --paper:#f8f6f1; }
    * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    html, body { width:100%; height:100%; margin:0; overflow:hidden; background:#060f31; position:fixed; }
    body { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    #app { width:100vw; height:100dvh; position:relative; overflow:hidden; background:
      radial-gradient(circle at 50% 10%, rgba(255,255,255,.11), transparent 34%),
      linear-gradient(135deg,#040b25 0%,#0a1747 48%,#03081e 100%); }
    #book-viewport {
      position:absolute;
      inset:0;
      display:grid;
      place-items:center;
      overflow:hidden;
      perspective:1600px;
    }
    #book-scale {
      position:relative;
      width:1040px;
      height:820px;
      transform-origin:center center;
      will-change:transform;
      display:grid;
      place-items:center;
    }
    #book-stage {
      position:relative;
      width:1040px;
      height:820px;
      transform-style:preserve-3d;
      perspective:1400px;
      overflow:visible;
    }
    .panel-shell {
      position:absolute;
      top:50%;
      left:50%;
      width:329.7px;
      height:700px;
      margin:0;
      transform-style:preserve-3d;
      transform-origin:center center;
      overflow:visible;
      will-change:transform,opacity;
    }
    .panel-shell img {
      display:block;
      width:100%;
      height:100%;
      object-fit:cover;
      object-position:center;
      border-radius:4px;
      user-select:none;
      -webkit-user-drag:none;
      backface-visibility:hidden;
      -webkit-backface-visibility:hidden;
      box-shadow:0 16px 32px rgba(0,0,0,.35),0 2px 6px rgba(0,0,0,.2);
    }
    .crease {
      position:absolute;
      top:0;
      bottom:0;
      width:18px;
      pointer-events:none;
      opacity:0;
      background:linear-gradient(90deg,transparent,rgba(0,0,0,.28),rgba(255,255,255,.22),transparent);
      filter:blur(1px);
      transform:translateZ(2px);
    }
    #assembled {
      z-index:100;
      position:absolute;
      left:50%;
      top:50%;
      width:1000px;
      height:auto;
      transform:translate(-50%,-50%);
      display:block;
      transform-style:preserve-3d;
      transform-origin:center center;
      will-change:transform,opacity;
    }
    #assembled img {
      display:block;
      width:100%;
      height:auto;
      margin:0;
      padding:0;
      border-radius:4px;
      box-shadow:0 20px 40px rgba(0,0,0,.4);
    }
    #assembled.hidden { display:none; }
    .grain { position:absolute; inset:0; pointer-events:none; opacity:.05; background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.35'/%3E%3C/svg%3E"); mix-blend-mode:screen; }
    .nav {
      position:absolute;
      top:50%;
      transform:translateY(-50%);
      width:48px;
      height:48px;
      background:rgba(255,255,255,.1);
      border:1px solid rgba(255,255,255,.2);
      border-radius:50%;
      display:grid;
      place-items:center;
      color:#fff;
      z-index:10;
      backdrop-filter:blur(4px);
    }
    #prev { left:12px; }
    #next { right:12px; }
    .hint {
      position:absolute;
      bottom:max(16px, env(safe-area-inset-bottom));
      left:50%;
      transform:translateX(-50%);
      color:rgba(255,255,255,.6);
      font-size:11px;
      letter-spacing:.5px;
      pointer-events:none;
      white-space:nowrap;
      z-index:10;
    }
  </style>
</head>
<body>
<div id="app">
  <div class="grain"></div>
  <div id="book-viewport">
    <div id="book-scale">
      <div id="book-stage" aria-live="polite">
        <div id="assembled" class="hidden" aria-hidden="true">
          <img src="https://res.cloudinary.com/dlnwn8bfb/image/upload/v1787658583/Digital_NSS_Brochure_page-0001_amyxwb.jpg" alt="NSS brochure inside spread" draggable="false">
          <img src="https://res.cloudinary.com/dlnwn8bfb/image/upload/v1787658583/Digital_NSS_Brochure_page-0002_unqraw.jpg" alt="NSS brochure outside spread" draggable="false">
        </div>
      </div>
    </div>
  </div>
  <button id="prev" class="nav" aria-label="Previous step">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 18l-6-6 6-6"/></svg>
  </button>
  <button id="next" class="nav" aria-label="Next step">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 18l6-6-6-6"/></svg>
  </button>
  <div class="hint" id="hint">Swipe left or right to explore</div>
</div>
<script>
(() => {
  const STAGE_W = 1040, STAGE_H = 820, PANEL_H = 700, PANEL_W = PANEL_H * .471;
  const viewport = document.querySelector('#book-viewport');
  const scaleWrap = document.querySelector('#book-scale');
  const stage = document.querySelector('#book-stage');
  const assembled = document.querySelector('#assembled');
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

  const panels = {
    p1:'https://res.cloudinary.com/dlnwn8bfb/image/upload/v1787653201/panel1_uakzha.jpg', 
    p2:'https://res.cloudinary.com/dlnwn8bfb/image/upload/v1787653232/panel4_lmy6vm.jpg', 
    p3:'https://res.cloudinary.com/dlnwn8bfb/image/upload/v1787653232/panel6_iede51.jpg',
    p4:'https://res.cloudinary.com/dlnwn8bfb/image/upload/v1787653231/panel5_euwjxf.jpg', 
    p5:'https://res.cloudinary.com/dlnwn8bfb/image/upload/v1787653230/panel3_puvzen.jpg', 
    p6:'https://res.cloudinary.com/dlnwn8bfb/image/upload/v1787653232/panel2_cvw1fs.jpg'
  };

  let state = 0, animating = false;
  let touchX = 0, touchT = 0, lastX = 0, lastT = 0;

  function getContentMetrics(step = state) {
    if (step === 6) {
      return { width:1000, height:1000 * 1448 / 2047 * 2 };
    }
    const count = (step === 0 || step === 3) ? 1 : (step === 1 || step === 4) ? 2 : 3;
    return {
      width: Math.max(PANEL_W, count * PANEL_W),
      height: PANEL_H
    };
  }

  function fitBook(step = state, animate = false) {
    const w = Math.max(1, viewport.clientWidth);
    const h = Math.max(1, viewport.clientHeight);
    const metrics = getContentMetrics(step);

    const horizontalPadding = 16;
    const verticalPadding = 90;

    let sx = (w - horizontalPadding) / metrics.width;
    let sy = (h - verticalPadding) / metrics.height;
    let scale = Math.min(sx, sy);
    if (step === 0 || step === 3) scale = Math.min(scale, 1);
    scale = Math.max(0.15, scale);

    const vars = { width:1040, height:820, scale };
    if (animate) gsap.to(scaleWrap, { ...vars, duration:0.3, ease:"power2.out", overwrite:true });
    else gsap.set(scaleWrap, vars);

    if (step === 6) fitAssembled(false);
  }

  function fitAssembled(animate = false) {
    const w = Math.max(1, viewport.clientWidth);
    const h = Math.max(1, viewport.clientHeight);
    const naturalW = 1000;
    const naturalH = naturalW * 1448 / 2047 * 2;

    const scale = Math.max(
      0.12,
      Math.min(
        (w - 20) / naturalW,
        (h - 80) / naturalH
      )
    );

    if (animate) {
      gsap.to(assembled, { scale, duration:0.3, ease:"power2.out", overwrite:true });
    } else {
      gsap.set(assembled, { scale });
    }
  }

  function centerStage() {
    gsap.set(stage, { x:0, y:0, rotationX:0, rotationY:0, rotationZ:0 });
    gsap.set(scaleWrap, { x:0, y:0, rotationX:0, rotationY:0, rotationZ:0 });
  }

  window.addEventListener('resize', () => fitBook(state, true));
  window.addEventListener('orientationchange', () => setTimeout(() => fitBook(state, true), 150));

  function clearPanels() { stage.querySelectorAll('.panel-shell').forEach(el => el.remove()); }
  const imageCache = new Map();

  function preloadImage(src) {
    if (imageCache.has(src)) return imageCache.get(src);
    const promise = new Promise(resolve => {
      const img = new Image();
      img.decoding = 'async';
      img.onload = async () => {
        try { if (img.decode) await img.decode(); } catch (_) {}
        resolve();
      };
      img.onerror = () => resolve();
      img.src = src;
      if (img.complete) {
        Promise.resolve(img.decode ? img.decode().catch(()=>{}) : null).then(resolve);
      }
    });
    imageCache.set(src, promise);
    return promise;
  }

  Object.values(panels).forEach(preloadImage);
  preloadImage('https://res.cloudinary.com/dlnwn8bfb/image/upload/v1787658583/Digital_NSS_Brochure_page-0002_unqraw.jpg');
  preloadImage('https://res.cloudinary.com/dlnwn8bfb/image/upload/v1787658583/Digital_NSS_Brochure_page-0001_amyxwb.jpg');

  async function ensureImage(src) {
    await preloadImage(src);
  }

  function makePanel(key, x, z=0, rot=0, hinge='center', hidden=false) {
    const el = document.createElement('div');
    el.className = 'panel-shell';
    el.dataset.key = key;
    el.style.left = '50%';
    el.style.marginLeft = '0px';
    el.style.zIndex = String(10 + Math.round(z));
    el.style.transformOrigin = hinge === 'left' ? 'left center' : hinge === 'right' ? 'right center' : 'center center';
    el.style.transform = `translate(-50%,-50%) translateX(${x}px) translateZ(${z}px) rotateY(${rot}deg)`;
    if (hidden) el.style.opacity = '0';
    const img = document.createElement('img');
    img.src = panels[key];
    img.alt = `NSS brochure ${key}`;
    img.draggable = false;
    img.decoding = 'async';
    img.loading = 'eager';
    el.appendChild(img);
    const crease = document.createElement('div');
    crease.className = 'crease';
    crease.style.left = rot ? 'auto' : 'calc(100% - 9px)';
    el.appendChild(crease);
    stage.appendChild(el);
    return el;
  }

  async function revealPanels(root=stage) {
    const imgs = [...root.querySelectorAll('.panel-shell img')];
    await Promise.all(imgs.map(async img => {
      const src = img.currentSrc || img.src;
      await ensureImage(src);
      try { if (img.decode) await img.decode(); } catch (_) {}
    }));
  }

  function groupPositions(count) {
    const total = count * PANEL_W;
    const start = -total / 2 + PANEL_W / 2;
    return Array.from({length:count}, (_, i) => start + i * PANEL_W);
  }

  async function renderStatic(s) {
    gsap.killTweensOf(stage.querySelectorAll('.panel-shell'));
    gsap.killTweensOf([stage, scaleWrap, assembled]);
    clearPanels();
    centerStage();
    gsap.set(assembled, {opacity:0, rotationY:0, scale:1});
    assembled.classList.add('hidden');
    assembled.setAttribute('aria-hidden', 'true');

    if (s === 0) {
      const p = makePanel('p1', 0, 0, 0, 'center', true);
      await revealPanels(stage);
      gsap.set(p, {x:0, y:0, rotationY:0, opacity:1, scale:1});
      return;
    }
    if (s === 1) { const xs = groupPositions(2); makePanel('p2', xs[0]); makePanel('p1', xs[1]); await revealPanels(stage); return; }
    if (s === 2) { const xs = groupPositions(3); makePanel('p3', xs[0]); makePanel('p2', xs[1]); makePanel('p1', xs[2]); await revealPanels(stage); return; }
    if (s === 3) {
      const p = makePanel('p4', 0, 0, 0, 'center', true);
      await revealPanels(stage);
      gsap.set(p, {x:0, y:0, rotationY:0, opacity:1, scale:1});
      return;
    }
    if (s === 4) { const xs = groupPositions(2); makePanel('p5', xs[0]); makePanel('p4', xs[1]); await revealPanels(stage); return; }
    if (s === 5) { const xs = groupPositions(3); makePanel('p6', xs[0]); makePanel('p5', xs[1]); makePanel('p4', xs[2]); await revealPanels(stage); return; }
    if (s === 6) {
      clearPanels();
      assembled.classList.remove('hidden');
      assembled.setAttribute('aria-hidden', 'false');
      gsap.set(assembled, {opacity:1, rotationY:0});
      fitAssembled(false);
      return;
    }
  }

  async function animateTo(nextState, dir) {
    if (animating) return;
    animating = true;
    const old = state;
    const motion = d => reduced ? 0.01 : d;

    try {
      if (nextState === 6) {
        gsap.killTweensOf(stage.querySelectorAll('.panel-shell'));
        clearPanels();
        assembled.classList.remove('hidden');
        assembled.setAttribute('aria-hidden', 'false');
        gsap.set(assembled, {opacity:0, scale:.95, rotationY:dir>0?3:-3});
        fitAssembled(false);
        await new Promise(resolve => gsap.to(assembled, {opacity:1, scale:1, rotationY:0, duration:motion(.45), ease:'power3.out', onComplete:resolve}));
        state = nextState;
        return;
      }
      if (old === 6) {
        gsap.killTweensOf(assembled);
        gsap.set(assembled, {opacity:0});
        assembled.classList.add('hidden');
        assembled.setAttribute('aria-hidden', 'true');
        state = nextState;
        await renderStatic(nextState);
        return;
      }

      const oldPanels = [...stage.querySelectorAll('.panel-shell')];
      const incomingKey = {1:'p2', 2:'p3', 3:'p4', 4:'p5', 5:'p6'}[nextState];

      if (dir < 0) {
        if (old === 1 || old === 4) {
          const left = oldPanels[0], right = oldPanels[1];
          await new Promise(resolve => gsap.timeline({defaults:{ease:'power3.inOut'}, onComplete:resolve})
            .to(left, {rotationY:-90, opacity:0, duration:motion(.45)}, 0)
            .to(right, {x:0, duration:motion(.45)}, 0));
          state = nextState; await renderStatic(nextState); return;
        }
        if (old === 2 || old === 5) {
          const oldTwo = groupPositions(2), oldThree = groupPositions(3);
          await new Promise(resolve => gsap.timeline({defaults:{ease:'power3.inOut'}, onComplete:resolve})
            .to(oldPanels[0], {rotationY:-90, opacity:0, duration:motion(.45)}, 0)
            .to(oldPanels[1], {x:oldTwo[0], duration:motion(.45)}, 0)
            .to(oldPanels[2], {x:oldTwo[1], duration:motion(.45)}, 0));
          state = nextState; await renderStatic(nextState); return;
        }
        if (old === 3) {
          await new Promise(resolve => gsap.to(oldPanels, {opacity:0, scale:.98, duration:motion(.2), onComplete:resolve}));
          state = nextState; await renderStatic(nextState); return;
        }
      }

      // Standalone -> 2 panels
      if (old === 0 || old === 3) {
        const xs = groupPositions(2), existing = oldPanels[0];
        await ensureImage(panels[incomingKey]);
        const incoming = makePanel(incomingKey, xs[0], -10, 90, 'right', true);
        gsap.set(existing, {x:0, opacity:1, rotationY:0, scale:1});
        await new Promise(resolve => gsap.timeline({defaults:{ease:'power3.inOut'}, onComplete:resolve})
          .to(existing, {x:xs[1], duration:motion(.5)}, 0)
          .set(incoming, {opacity:1}, motion(.08))
          .to(incoming, {rotationY:0, duration:motion(.55)}, motion(.08)));
        state = nextState; await renderStatic(nextState); return;
      }

      // 2 panels -> 3 panels (FIXED ghosting/flicker by removing abrupt x reset on old panels)
      if (old === 1 || old === 4) {
        const xs = groupPositions(3), oldTwo = groupPositions(2);
        await ensureImage(panels[incomingKey]);
        const incoming = makePanel(incomingKey, xs[0], -10, 90, 'right', true);
        
        // Keep existing panels at their current respective positions without snapping to 0
        oldPanels.forEach((p, idx) => {
          gsap.set(p, {x: oldTwo[idx], y:0, opacity:1, rotationY:0, scale:1});
        });

        await new Promise(resolve => gsap.timeline({defaults:{ease:'power3.inOut'}, onComplete:resolve})
          .to(oldPanels[0], {x: xs[1], duration:motion(.5)}, 0)
          .to(oldPanels[1], {x: xs[2], duration:motion(.5)}, 0)
          .set(incoming, {opacity:1}, motion(.08))
          .to(incoming, {rotationY:0, duration:motion(.55)}, motion(.08)));
        state = nextState; await renderStatic(nextState); return;
      }

      if (old === 2 && nextState === 3) {
        await new Promise(resolve => gsap.to(oldPanels, {opacity:0, scale:.98, duration:motion(.2), stagger:.01, onComplete:resolve}));
        state = nextState; await renderStatic(nextState); return;
      }

      state = nextState;
      await renderStatic(nextState);
    } finally {
      animating = false;
      fitBook(state, false);
    }
  }

  function go(delta) { const next = (state + delta + 7) % 7; animateTo(next, delta); }
  document.querySelector('#next').addEventListener('click', () => go(1));
  document.querySelector('#prev').addEventListener('click', () => go(-1));

  viewport.addEventListener('touchstart', e => { 
    const t = e.changedTouches[0]; 
    touchX = lastX = t.clientX; 
    touchT = lastT = performance.now(); 
  }, {passive:true});

  viewport.addEventListener('touchmove', e => { 
    const t = e.changedTouches[0]; 
    lastX = t.clientX; 
    lastT = performance.now(); 
  }, {passive:true});

  viewport.addEventListener('touchend', () => { 
    const dx = lastX - touchX, dt = Math.max(1, lastT - touchT), velocity = Math.abs(dx / dt); 
    if (Math.abs(dx) > 35 || velocity > 0.3) go(dx < 0 ? 1 : -1); 
  }, {passive:true});

  (async () => {
    await Promise.all(Object.values(panels).map(preloadImage));
    await preloadImage('https://res.cloudinary.com/dlnwn8bfb/image/upload/v1787658583/Digital_NSS_Brochure_page-0002_unqraw.jpg');
    await preloadImage('https://res.cloudinary.com/dlnwn8bfb/image/upload/v1787658583/Digital_NSS_Brochure_page-0001_amyxwb.jpg');
    await renderStatic(0);
    fitBook(0, false);
  })();
})();
</script>
</body>
</html>
